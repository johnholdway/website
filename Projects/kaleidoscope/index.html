<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kaleidoscope</title>
    
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    
    <canvas id="visual"></canvas>

<div id="audioControls">
    <button id="micButton">♫ Enable Microphone</button>

    <div id="audioLevels">
        <div>
            <span>Bass</span>
            <div class="meter">
                <div id="bassMeter"></div>
            </div>
        </div>

        <div>
            <span>Mid</span>
            <div class="meter">
                <div id="midMeter"></div>
            </div>
        </div>

        <div>
            <span>Treble</span>
            <div class="meter">
                <div id="trebleMeter"></div>
            </div>
        </div>
    </div>
</div>

<footer>
    <a href="https://johnholdway.com">Back to JohnHoldway.com</a>
</footer>
    <script src="js/kaleidoscope.js"></script>
</body>
</html>
